name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  CGO_ENABLED: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check test
      - run: make test-envtest

  validate-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make helm-lint

  build-publish:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - validate-helm-chart
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.0.0

      - name: Set up GoReleaser environment variables
        id: goreleaser-env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "args=release --clean --skip=validate" >> "$GITHUB_OUTPUT"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "args=build --clean --skip=validate" >> "$GITHUB_OUTPUT"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: "${{ steps.goreleaser-env.outputs.args }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

image:
  repository: ghcr.io/tinkerbell-community/tinkerbell-bmc-discovery-controller
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

discovery:
  # DNS-SD service types to browse. OpenBMC advertises _obmc_redfish._tcp;
  # standard Redfish services advertise _redfish._tcp.
  serviceTypes:
    - _redfish._tcp
    - _obmc_console._tcp
  domain: local.
  browseInterval: 5m
  browseWindow: 30s
  resyncInterval: 1h
  collectTimeout: 2m
  # Redfish port override; 0 uses the mDNS-advertised port. Set (usually 443)
  # when browsing non-Redfish service types such as _obmc_console._tcp, whose
  # advertised port is the console, not Redfish.
  redfishPort: 0

credentials:
  # Name of the Secret (in the release namespace) with username/password keys.
  name: bmc-discovery-credentials
  # Create the Secret from the values below. Leave false to manage it yourself.
  create: false
  username: ""
  password: ""
  # Known default credentials keyed by DNS-SD service type, with "*" as the
  # catch-all. The controller tries the Secret above first (when present),
  # then the matching service default, then "*", pivoting until one pair
  # authenticates against the BMC. Add entries for the vendor defaults known
  # in your environment. These are well-known vendor defaults, not secrets —
  # anything sensitive belongs in the Secret.
  defaults:
    "*":
      username: admin
      password: admin
    _obmc_console._tcp:
      username: root
      password: 0penBmc
    _obmc_redfish._tcp:
      username: root
      password: 0penBmc

# Skip BMC TLS verification (BMCs commonly serve self-signed certificates).
insecureTLS: true

leaderElection: true

# mDNS needs multicast reachability to the BMC network. Either run on the
# host network (default), or attach a dedicated interface on the BMC VLAN
# via Multus ipvlan (networking.multus.enabled) — multus takes precedence
# and turns host networking off.
networking:
  hostNetwork: true
  multus:
    enabled: false
    # NetworkAttachmentDefinition name; created when create is true.
    name: bmc-discovery-mdns
    create: true
    # Node interface the ipvlan rides on (the uplink carrying the BMC VLAN).
    master: eth0
    # ipvlan mode: l2 supports multicast receive.
    mode: l2
    # Raw CNI IPAM config for the attachment, rendered as JSON. mDNS is
    # link-local multicast, so the interface only needs an IPv4 link-local
    # address (169.254.0.0/16) — no routable IP on the BMC VLAN is consumed.
    # host-local keeps allocation state per node, which is fine for this
    # single-replica controller.
    ipam:
      type: host-local
      subnet: 169.254.200.0/24
      rangeStart: 169.254.200.10
      rangeEnd: 169.254.200.50
    # Pod interface name Multus assigns; mDNS browsing binds to it.
    interface: net1

# debug, info, warn, or error. debug logs every discovery/verification step.
logLevel: info
# json or text.
logFormat: json

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

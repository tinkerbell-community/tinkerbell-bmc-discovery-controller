{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bmc-discovery.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "credentials.username is required when credentials.create is true" .Values.credentials.username | quote }}
  password: {{ required "credentials.password is required when credentials.create is true" .Values.credentials.password | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bmc-discovery.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bmc-discovery.labels" . | nindent 4 }}
spec:
  replicas: 1
  # hostNetwork pods pin host ports, so a rolling update deadlocks when no
  # other node can host the new pod; recreate the single replica instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bmc-discovery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bmc-discovery.selectorLabels" . | nindent 8 }}
      {{- if .Values.networking.multus.enabled }}
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": {{ .Values.networking.multus.name | quote }}, "namespace": {{ .Release.Namespace | quote }}, "interface": {{ .Values.networking.multus.interface | quote }}}]'
      {{- end }}
    spec:
      serviceAccountName: {{ include "bmc-discovery.name" . }}
      {{- $hostNetwork := and .Values.networking.hostNetwork (not .Values.networking.multus.enabled) }}
      hostNetwork: {{ $hostNetwork }}
      {{- if $hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --namespace={{ .Release.Namespace }}
            - --service-types={{ join "," .Values.discovery.serviceTypes }}
            - --mdns-domain={{ .Values.discovery.domain }}
            - --browse-interval={{ .Values.discovery.browseInterval }}
            - --browse-window={{ .Values.discovery.browseWindow }}
            - --resync-interval={{ .Values.discovery.resyncInterval }}
            - --collect-timeout={{ .Values.discovery.collectTimeout }}
            - --credentials-secret={{ .Values.credentials.name }}
            {{- $defaults := list }}
            {{- range $svc, $cred := .Values.credentials.defaults }}
            {{- $defaults = append $defaults (printf "%s=%s:%s" $svc $cred.username $cred.password) }}
            {{- end }}
            - --default-credentials={{ join "," $defaults }}
            - --redfish-port={{ .Values.discovery.redfishPort }}
            {{- with .Values.naming.template }}
            - --name-template={{ . }}
            {{- end }}
            - --facility-code={{ .Values.hardware.facilityCode }}
            - --auto-enrollment={{ .Values.hardware.autoEnrollment }}
            {{- if .Values.networking.multus.enabled }}
            - --mdns-interfaces={{ .Values.networking.multus.interface }}
            {{- end }}
            - --insecure-tls={{ .Values.insecureTLS }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logLevel }}
            - --log-format={{ .Values.logFormat }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

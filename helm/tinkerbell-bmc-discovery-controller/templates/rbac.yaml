apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bmc-discovery.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bmc-discovery.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [bmc.tinkerbell.org]
    resources: [machines]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [tinkerbell.org]
    resources: [hardware]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bmc-discovery.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bmc-discovery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bmc-discovery.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bmc-discovery.name" . }}
    namespace: {{ .Release.Namespace }}

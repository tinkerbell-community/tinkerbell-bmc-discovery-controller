{{- /*
CAPI-facing grants. Cluster-scoped by default; teardown.watchNamespace scopes
them to one namespace (docs/talos-machine-teardown.md RBAC section).
*/ -}}
{{- $scoped := ne .Values.teardown.watchNamespace "" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $scoped }}
metadata:
  name: {{ include "teardown.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.teardown.watchNamespace }}
  {{- end }}
  labels:
    {{- include "teardown.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["tinkerbellmachines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tinkerbell.org"]
    resources: ["hardware"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # The structured events recorder (events.k8s.io/v1) writes Machine events
  # in the CAPI namespace; the core-group grant covers legacy consumers.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $scoped }}
metadata:
  name: {{ include "teardown.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.teardown.watchNamespace }}
  {{- end }}
  labels:
    {{- include "teardown.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $scoped }}
  name: {{ include "teardown.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "teardown.name" . }}
    namespace: {{ .Release.Namespace }}
---
{{- /*
Own-namespace grants: the cached talosconfig secrets, leader election, and
event emission from the release namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "teardown.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teardown.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "teardown.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teardown.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "teardown.name" . }}-local
subjects:
  - kind: ServiceAccount
    name: {{ include "teardown.name" . }}
    namespace: {{ .Release.Namespace }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teardown.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teardown.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teardown.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teardown.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "teardown.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --watch-namespace={{ .Values.teardown.watchNamespace }}
            - --etcd-timeout={{ .Values.teardown.etcdTimeout }}
            - --reset-timeout={{ .Values.teardown.resetTimeout }}
            - --etcd-call-timeout={{ .Values.teardown.etcdCallTimeout }}
            - --reset-call-timeout={{ .Values.teardown.resetCallTimeout }}
            - --concurrency={{ .Values.teardown.concurrency }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logging.level }}
            - --log-format={{ .Values.logging.format }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
